services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    ports:
      - "1996:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    ports:
      - "2000:8000"
    volumes:
      - db-data:/app/data
    environment:
      - DB_PATH=/app/data/nosso_mapa.db
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/categories')"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  db-data:
