name: Publish images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/fabriciooml/nosso-mapa-backend:main
            ghcr.io/fabriciooml/nosso-mapa-backend:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/Fabriciooml/nosso-mapa

      - name: Build and publish frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_GOOGLE_MAPS_API_KEY=${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
            VITE_APP_NAME=${{ vars.VITE_APP_NAME }}
            VITE_DEFAULT_CENTER_LAT=${{ vars.VITE_DEFAULT_CENTER_LAT }}
            VITE_DEFAULT_CENTER_LNG=${{ vars.VITE_DEFAULT_CENTER_LNG }}
          tags: |
            ghcr.io/fabriciooml/nosso-mapa-frontend:main
            ghcr.io/fabriciooml/nosso-mapa-frontend:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/Fabriciooml/nosso-mapa
